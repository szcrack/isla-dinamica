name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # setup-android's default package list includes the obsolete
          # "tools" package, which no longer exists and makes sdkmanager
          # exit 1. Install only what the build needs.
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Isla-Dinamica-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
